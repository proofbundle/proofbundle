[package]
name = "proofbundle"
version = "2.2.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Native ProofBundle artifact custody and verification CLI"

[[bin]]
name = "proofbundle"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tiny_http = "0.12"
walkdir = "2"
